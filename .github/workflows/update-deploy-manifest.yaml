name: "update gitops manifest files"

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build"
        type: choice
        required: true
        options:
          - services/go/api-golang
          - services/node/api-node
          - services/python/load-generator-python
          - services/other/api-golang-migrator
          - services/react/client-react
      version:
        description: "Version/tag to use"
        required: true
        type: string
      environment:
        description: "Environment to which the workflow changes manifest"
        required: true

concurrency:
  group: ${{ github.workflow }}-gitops-${{ inputs.service }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  update-manifest:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: "Setup Dependencies"
        uses: ./.github/actions/setup-dependencies/
      - name: "Generate Commit Message"
        id: commit-message
        run: |
          commit_message="updating for ${{ inputs.environment }} environment, ${{ inputs.service }} service, ${{ inputs.version }} version. [skip ci]"
          echo "message=$commit_message" >> $GITHUB_OUTPUT
      - name: "Update the manifests (via task)"
        working-directory: ${{ inputs.service }}
        run: |
          task utils:update-image-tags-service \
            NEW_TAG=${{ inputs.version }} \
            ENVIRONMENT=${{ inputs.environment }}
      - name: "Show git diff"
        run: git --no-pager diff
      - name: "Commit manifest changes (via task)"
        working-directory: ${{ inputs.service }}
        run: |
          task utils:git:commit-push \
            COMMIT_MSG="${{ steps.commit-message.outputs.message}}"
