name: "Build artifact and push to Docker Hub"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: "Setup Dependencies"
        uses: ./.github/actions/setup-dependencies/actions.yaml
      - name: "Login DockerHub"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PRIVATE_TOKEN }}
      - name: "Setup QEMU"
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - name: "Setup Buildx"
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: "Create Tags"
        id: image-tag
        run: |
          tag=foo
          echo $tag >> $GITHUB_OUTPUT
      - name: "Build and Push Image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./services/go/api-golang/
          tags: ${{ steps.image-tag.outputs.tag}}
          push: true
          cache-from: type=gha
          cache-to: type=gha
