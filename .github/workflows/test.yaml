name: "Test Workflow"

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          filters: ".github/utils/file-filters.yaml"

  test:
    needs: filter
    if: ${{ needs.filter.outputs.changes != '[]' && needs.filter.outputs.changes != '' }}
    strategy:
      matrix:
        service:
          ${{ fromJson(needs.filter.outputs.services) }}
          # [
          # "services/node/api-node",
          # "services/go/api-golang",
          # "services/react/client-react",
          # "services/python/load-generator-python",
          # ]
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: "Setup Node"
        if: ${{ matrix.service == 'services/node/api-node' || matrix.service == 'services/react/client-react' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
          node-version-file: ${{ matrix.service }}/package.json
      - name: "Setup Go"
        if: ${{ matrix.service == 'services/go/api-golang' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache-dependency-path: "services/node/api-golang/go.sum"
          go-version-file: "services/node/api-golang/go.mod"
          go-version: 1.23
      - name: "Install Poetry"
        if: ${{ matrix.service == 'services/python/load-generator-python' }}
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263
      - name: "Setup Python"
        if: ${{ matrix.service == 'services/python/load-generator-python' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          cache: poetry
          cache-dependency-path: ${{ matrix.service }}/poetry.lock
          python-version-file: ${{ matrix.service }}/pyproject.toml
      - name: "Install taskfile"
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
      - name: "Install dependencies"
        working-directory: ${{ matrix.service }}
        run: task install
      - name: "Run Tests"
        working-directory: ${{ matrix.service }}
        run: "task test"
